<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaraPOS Web App</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Custom Font and Styling */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        
        :root {
            --color-gold: #FFD700;
            --color-green-dark: #10B981; /* Tailwind's emerald-500/600 */
            --color-green-soft: #ECFDF5; /* Tailwind's emerald-50 */
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--color-green-soft) 0%, #FFFFFF 100%);
        }

        /* Branding Text Style */
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem; /* Larger text for logo */
            color: var(--color-gold);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Tile Styles for Mobile Dashboard */
        .tile {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            border: 2px solid rgba(255, 215, 0, 0.5);
        }
        .tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        .tile-icon {
            color: var(--color-green-dark);
        }

        /* General UI Styling */
        .btn-primary {
            background-color: var(--color-green-dark);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #059669; /* Slightly darker green */
        }
    </style>
</head>
<body class="p-4 sm:p-6 pb-20">
    <!-- Header/Branding - Includes Home Navigation -->
    <header class="mb-6 flex flex-col items-center relative">
        <!-- Home Button for non-home pages -->
        <button id="home-nav-button" onclick="navigate('home')" 
                class="absolute top-2 left-0 p-2 text-green-600 hover:text-green-800 transition-opacity hidden sm:block">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </button>

        <!-- Logo/Title - ALWAYS clickable to go Home -->
        <a href="#" onclick="navigate('home'); return false;" class="block text-center mb-1">
            <h1 class="logo-text leading-none">TARA</h1>
            <h2 class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Tara Home Products POS</h2>
        </a>
        <hr class="w-1/3 my-4 border-gray-300">
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="max-w-4xl mx-auto">
        <!-- Views will be dynamically inserted here -->
    </main>

    <!-- Floating Message Box (for alerts/confirmations) -->
    <div id="message-box" class="fixed top-0 left-0 right-0 p-4 bg-green-500 text-white text-center transition-transform duration-300 transform -translate-y-full z-50 rounded-b-lg shadow-xl">
        A message goes here.
    </div>

    <!-- Navigation Footer (Fixed for Mobile) -->
    <footer id="nav-footer" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-2 flex justify-around sm:hidden z-40">
        <!-- Navigation buttons for mobile will be added here -->
    </footer>

    <script>
        // --- GLOBAL STATE AND CONSTANTS ---
        const COMPANY_NAME = "Tara Home Products";
        const RUPEE = '₹';
        
        let currentState = {
            activeView: 'home',
            products: [],
            customers: [],
            invoices: [],
            settings: {
                companyInfo: {
                    fssai: '21221191000109',
                    address: 'No. 123, Gandhi Nagar, Chennai - 600001',
                    phone: '+91 98765 43210',
                    name: COMPANY_NAME
                },
                googleSheetLink: ''
            },
            currentSale: {
                customerName: '',
                cart: [],
                total: 0
            }
        };

        const DEFAULT_PRODUCTS = [
            { id: 'p1', name: 'Mango Pickle', weight: '250g', price: 100, details: 'Sweet and Tangy Mango Pickle' },
            { id: 'p2', name: 'Garlic Pickle', weight: '250g', price: 100, details: 'Spicy Garlic Pickle, perfect with rice' },
            { id: 'p3', name: 'Prawn Pickle', weight: '250g', price: 100, details: 'Authentic South Indian Prawn Pickle' },
            { id: 'p4', name: 'Lemon Pickle', weight: '250g', price: 100, details: 'Traditional Homemade Lemon Pickle' }
        ];

        // --- UTILITY FUNCTIONS ---

        /** Shows a temporary toast message instead of alert() */
        function showMessage(text) {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.classList.remove('-translate-y-full');
            setTimeout(() => {
                box.classList.add('-translate-y-full');
            }, 3000);
        }

        /** Formats a number to Indian Rupees (₹) */
        function formatCurrency(amount) {
            // Using Intl.NumberFormat for robust currency display (used in HTML)
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 2,
            }).format(Number(amount));
        }

        /** Generates a unique ID */
        function generateId() {
            return 'id-' + Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        /** Gets current date/time string for invoice */
        function getCurrentDateTime() {
            return new Date().toLocaleString('en-IN', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        }

        // --- LOCAL STORAGE PERSISTENCE ---

        function loadState() {
            const storedProducts = localStorage.getItem('tara_products');
            const storedCustomers = localStorage.getItem('tara_customers');
            const storedInvoices = localStorage.getItem('tara_invoices');
            const storedSettings = localStorage.getItem('tara_settings');

            // Load products or use default and save if not found
            if (storedProducts) {
                currentState.products = JSON.parse(storedProducts);
            } else {
                currentState.products = DEFAULT_PRODUCTS.map(p => ({ ...p, id: generateId() }));
                saveProducts();
            }

            // Load other data
            if (storedCustomers) currentState.customers = JSON.parse(storedCustomers);
            if (storedInvoices) currentState.invoices = JSON.parse(storedInvoices);
            if (storedSettings) currentState.settings = { ...currentState.settings, ...JSON.parse(storedSettings) };

            // Ensure company name is always correct
            currentState.settings.companyInfo.name = COMPANY_NAME;
        }

        function saveProducts() {
            localStorage.setItem('tara_products', JSON.stringify(currentState.products));
        }

        function saveCustomers() {
            localStorage.setItem('tara_customers', JSON.stringify(currentState.customers));
        }

        function saveInvoices() {
            localStorage.setItem('tara_invoices', JSON.stringify(currentState.invoices));
        }

        function saveSettings() {
            localStorage.setItem('tara_settings', JSON.stringify(currentState.settings));
            // Ensure company name is always correct
            currentState.settings.companyInfo.name = COMPANY_NAME;
        }

        // --- NAVIGATION AND VIEW RENDERING ---

        function navigate(viewName) {
            currentState.activeView = viewName;
            renderView();
        }

        function renderView() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            let content;

            switch (currentState.activeView) {
                case 'home':
                    content = renderHomeView();
                    break;
                case 'products':
                    content = renderProductsView();
                    break;
                case 'sales':
                    content = renderSalesView();
                    break;
                case 'invoices':
                    content = renderInvoicesView();
                    break;
                case 'reports':
                    content = renderReportsView();
                    break;
                case 'customers':
                    content = renderCustomersView();
                    break;
                case 'settings':
                    content = renderSettingsView();
                    break;
                default:
                    content = renderHomeView();
            }
            container.appendChild(content);

            // Update Home Button visibility
            const homeButton = document.getElementById('home-nav-button');
            if (homeButton) {
                if (currentState.activeView === 'home') {
                    homeButton.classList.add('hidden');
                } else {
                    homeButton.classList.remove('hidden');
                }
            }
            // Re-render mobile navigation footer
            renderMobileNav();
        }

        function renderMobileNav() {
            const navFooter = document.getElementById('nav-footer');
            if (navFooter.classList.contains('hidden')) return; // Desktop/Tablet size

            const navItems = [
                { name: 'Home', view: 'home', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                { name: 'Sale', view: 'sales', icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8a6 6 0 00-6 6v7h12v-7a6 6 0 00-6-6z' },
                { name: 'Products', view: 'products', icon: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m4 4v10l8 4m0-10v10' },
                { name: 'Invoices', view: 'invoices', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h.01M9 15h.01' },
            ];

            navFooter.innerHTML = navItems.map(item => `
                <button onclick="navigate('${item.view}')" class="flex flex-col items-center p-1 text-xs font-medium ${currentState.activeView === item.view ? 'text-green-600' : 'text-gray-500 hover:text-green-500'} transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${item.icon}"></path></svg>
                    <span>${item.name}</span>
                </button>
            `).join('');
        }

        // --- 1. HOME / DASHBOARD VIEW ---

        function renderHomeView() {
            const homeDiv = document.createElement('div');
            homeDiv.className = 'py-4';

            const tiles = [
                { name: 'New Sale', view: 'sales', icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8a6 6 0 00-6 6v7h12v-7a6 6 0 00-6-6z', bgColor: 'bg-green-100', iconColor: 'text-green-600' },
                { name: 'Products', view: 'products', icon: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m4 4v10l8 4m0-10v10', bgColor: 'bg-yellow-50', iconColor: 'text-yellow-600' },
                { name: 'Invoices', view: 'invoices', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h.01M9 15h.01', bgColor: 'bg-green-100', iconColor: 'text-green-600' },
                { name: 'Reports', view: 'reports', icon: 'M7 12l3-3 3 3 4-4M3 21h18a2 2 0 002-2V5a2 2 0 00-2-2H3a2 2 0 00-2 2v14a2 2 0 002 2z', bgColor: 'bg-yellow-50', iconColor: 'text-yellow-600' },
                { name: 'Customers', view: 'customers', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20v-2a3 3 0 00-5.356-1.857M10 12V5a2 2 0 00-2-2H4a2 2 0 00-2 2v7a2 2 0 002 2h6zm-5 4h.01M17 16h.01', bgColor: 'bg-green-100', iconColor: 'text-green-600' },
                { name: 'Settings', view: 'settings', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.82 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.82 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.82-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.82-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z', bgColor: 'bg-green-100', iconColor: 'text-green-600' },
            ];

            homeDiv.innerHTML = `
                <h3 class="text-xl font-semibold mb-4 text-gray-800">Dashboard</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
                    ${tiles.map(tile => `
                        <div onclick="navigate('${tile.view}')" class="tile ${tile.bgColor} p-4 rounded-xl flex flex-col items-center justify-center text-center">
                            <svg class="w-8 h-8 mb-2 ${tile.iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${tile.icon}"></path></svg>
                            <span class="font-medium text-sm text-gray-700">${tile.name}</span>
                        </div>
                    `).join('')}
                </div>

                <!-- Recent Invoices -->
                <h3 class="text-xl font-semibold mb-3 text-gray-800">Recent Sales</h3>
                ${renderInvoiceList(currentState.invoices.slice(-5).reverse())}
            `;
            return homeDiv;
        }

        // --- 2. PRODUCTS VIEW ---

        function renderProductsView() {
            const productDiv = document.createElement('div');
            productDiv.className = 'py-4';

            productDiv.innerHTML = `
                <h3 class="text-2xl font-semibold mb-4 text-gray-800">Product List</h3>
                <button onclick="openProductModal()" class="btn-primary mb-6 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Add New Product
                </button>
                <div id="product-list-container" class="space-y-4">
                    ${currentState.products.map(p => `
                        <div class="bg-white p-4 rounded-xl shadow flex items-center justify-between border-l-4 border-green-500">
                            <div class="flex-grow">
                                <p class="text-lg font-bold text-gray-800">${p.name}</p>
                                <p class="text-sm text-gray-500">${p.weight} | ${formatCurrency(p.price)}</p>
                                <p class="text-xs text-gray-400">${p.details || 'No details'}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="openProductModal('${p.id}')" class="p-2 text-green-600 hover:text-green-800 rounded-full bg-green-50">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                </button>
                                <button onclick="deleteProduct('${p.id}')" class="p-2 text-red-600 hover:text-red-800 rounded-full bg-red-50">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    `).join('') || '<p class="text-gray-500 p-4 bg-white rounded-xl">No products found. Add your first product!</p>'}
                </div>
                ${renderProductModal()}
            `;
            return productDiv;
        }

        function openProductModal(productId = null) {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            form.reset();
            document.getElementById('product-id').value = productId || '';

            if (productId) {
                const product = currentState.products.find(p => p.id === productId);
                if (product) {
                    document.getElementById('product-name').value = product.name;
                    document.getElementById('product-weight').value = product.weight;
                    document.getElementById('product-price').value = product.price;
                    document.getElementById('product-details').value = product.details || '';
                    document.getElementById('modal-title').textContent = 'Edit Product';
                }
            } else {
                document.getElementById('modal-title').textContent = 'Add New Product';
            }

            modal.classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function saveProduct(event) {
            event.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('product-name').value.trim();
            const weight = document.getElementById('product-weight').value.trim();
            const price = parseFloat(document.getElementById('product-price').value);
            const details = document.getElementById('product-details').value.trim();

            if (!name || isNaN(price) || price <= 0) {
                showMessage('Please enter a valid name and price.');
                return;
            }

            if (id) {
                // Edit
                const index = currentState.products.findIndex(p => p.id === id);
                if (index > -1) {
                    currentState.products[index] = { ...currentState.products[index], name, weight, price, details };
                    showMessage('Product updated successfully!');
                }
            } else {
                // Add
                const newProduct = { id: generateId(), name, weight, price, details };
                currentState.products.push(newProduct);
                showMessage('Product added successfully!');
            }

            saveProducts();
            closeProductModal();
            renderView(); // Re-render the products list
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                currentState.products = currentState.products.filter(p => p.id !== id);
                saveProducts();
                showMessage('Product deleted.');
                renderView();
            }
        }

        function renderProductModal() {
            return `
                <div id="product-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 p-4">
                    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md">
                        <h4 id="modal-title" class="text-xl font-bold mb-4 text-gray-800">Add New Product</h4>
                        <form id="product-form" onsubmit="saveProduct(event)">
                            <input type="hidden" id="product-id">
                            <div class="mb-4">
                                <label for="product-name" class="block text-sm font-medium text-gray-700">Name</label>
                                <input type="text" id="product-name" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label for="product-weight" class="block text-sm font-medium text-gray-700">Weight/Unit</label>
                                    <input type="text" id="product-weight" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border" value="250g">
                                </div>
                                <div>
                                    <label for="product-price" class="block text-sm font-medium text-gray-700">Price (${RUPEE})</label>
                                    <input type="number" id="product-price" required step="0.01" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">
                                </div>
                            </div>
                             <div class="mb-4">
                                <label for="product-details" class="block text-sm font-medium text-gray-700">Details/Description</label>
                                <textarea id="product-details" rows="2" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border"></textarea>
                            </div>
                            <div class="flex justify-end space-x-3 mt-6">
                                <button type="button" onclick="closeProductModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300">Cancel</button>
                                <button type="submit" class="px-4 py-2 text-sm font-medium bg-green-500 text-white rounded-md hover:bg-green-600">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        // --- 3. SALES VIEW ---

        function updateCartTotal() {
            let total = currentState.currentSale.cart.reduce((sum, item) => {
                // Use temporary price if available, otherwise use default
                const priceToUse = item.tempPrice !== undefined ? item.tempPrice : item.price;
                return sum + (priceToUse * item.quantity);
            }, 0);
            currentState.currentSale.total = total;

            const totalEl = document.getElementById('sale-total-amount');
            if (totalEl) totalEl.textContent = formatCurrency(total);
        }

        function updateCart(productId, action, value = 0) {
            const cartItemIndex = currentState.currentSale.cart.findIndex(item => item.productId === productId);

            if (cartItemIndex === -1) {
                // Should only happen on initial add
                const product = currentState.products.find(p => p.id === productId);
                if (!product) return;
                currentState.currentSale.cart.push({
                    productId: product.id,
                    name: product.name,
                    weight: product.weight,
                    price: product.price,
                    tempPrice: product.price, // Initialize tempPrice
                    quantity: 1
                });
            } else {
                const item = currentState.currentSale.cart[cartItemIndex];
                if (action === 'add') {
                    item.quantity += 1;
                } else if (action === 'subtract') {
                    item.quantity -= 1;
                    if (item.quantity <= 0) {
                        currentState.currentSale.cart.splice(cartItemIndex, 1);
                    }
                } else if (action === 'delete') {
                    currentState.currentSale.cart.splice(cartItemIndex, 1);
                } else if (action === 'price_override') {
                    const priceValue = parseFloat(value);
                    item.tempPrice = isNaN(priceValue) || priceValue <= 0 ? item.price : priceValue;
                } else if (action === 'set_quantity') {
                    const qtyValue = parseInt(value);
                    if (isNaN(qtyValue) || qtyValue <= 0) {
                        currentState.currentSale.cart.splice(cartItemIndex, 1);
                    } else {
                        item.quantity = qtyValue;
                    }
                }
            }
            updateCartTotal();
            renderView(); // Re-render the sales view to update cart display
        }

        function handleProductSelection() {
            const select = document.getElementById('product-select');
            const productId = select.value;
            if (productId) {
                updateCart(productId, 'add');
                select.value = ''; // Reset select
            }
        }

        function startNewSale() {
            currentState.currentSale = {
                customerName: '',
                cart: [],
                total: 0
            };
            const customerInput = document.getElementById('customer-name-input');
            if(customerInput) customerInput.value = '';
            renderView();

        function generateInvoice() {
            const customerNameInput = document.getElementById('customer-name-input');
            const customerName = customerNameInput ? customerNameInput.value.trim() : 'Cash Customer';
            
            if (currentState.currentSale.cart.length === 0) {
                showMessage('Cart is empty. Please add products to generate an invoice.');
                return;
            }

            // 1. Save/Update Customer
            if (customerName && customerName !== 'Cash Customer') {
                const existingCustomer = currentState.customers.find(c => c.name.toLowerCase() === customerName.toLowerCase());
                if (!existingCustomer) {
                    currentState.customers.push({ id: generateId(), name: customerName, phone: '', place: '', details: '' });
                    saveCustomers();
                }
                currentState.currentSale.customerName = customerName;
            } else {
                currentState.currentSale.customerName = 'Cash Customer';
            }

            // 2. Create Invoice Record
            const invoice = {
                id: generateId(),
                invoiceNumber: (currentState.invoices.length + 1).toString().padStart(4, '0'),
                date: getCurrentDateTime(),
                customerName: currentState.currentSale.customerName,
                items: JSON.parse(JSON.stringify(currentState.currentSale.cart)), // Deep copy cart
                total: currentState.currentSale.total,
            };

            // 3. Save Invoice
            currentState.invoices.push(invoice);
            saveInvoices();

            // 4. Generate PDF
            generateInvoicePDF(invoice);

            // 5. Reset Sale
            startNewSale();
            navigate('invoices');
            showMessage(`Invoice #${invoice.invoiceNumber} created and downloaded!`);
        }

        // --- PDF Generation and WhatsApp Share ---

        function generateInvoicePDF(invoice) {
            // Using jsPDF from window object
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const company = currentState.settings.companyInfo;
            const margin = 15;
            let y = margin;
            const lineHeight = 7;
            const colWidths = [50, 25, 30, 30]; // Name, Qty, Price, Total

            // --- Header (Green and Gold Theme) ---
            doc.setFillColor(33, 150, 83); // Dark Green
            doc.rect(0, 0, 210, 30, 'F');
            
            // Logo Text (Tara) - Gold
            // NOTE: jsPDF standard fonts don't support custom fonts, using default bold
            doc.setFont('times', 'bold');
            doc.setFontSize(28);
            doc.setTextColor(255, 215, 0); // Gold
            doc.text("Tara", margin, y + 5);

            // Company Name and Tagline
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.setTextColor(255, 255, 255); // White
            doc.text(company.name, margin, y + 14);
            
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text("Homemade Delicacies", margin, y + 20);
            y += 35; 

            // --- Invoice Details ---
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.setTextColor(0, 0, 0); // Black
            doc.text("SALES INVOICE", margin, y);
            y += lineHeight;

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text(`Invoice No: ${invoice.invoiceNumber}`, margin, y);
            doc.text(`Date: ${invoice.date}`, 150, y);
            y += lineHeight;
            doc.text(`Customer: ${invoice.customerName}`, margin, y);
            y += lineHeight * 1.5;

            // --- Items Table Header ---
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.setFillColor(220, 220, 220); // Light Gray
            doc.rect(margin, y, 180, lineHeight, 'F');
            doc.text("Product Name", margin + 2, y + lineHeight * 0.7);
            doc.text("Qty", margin + colWidths[0] + 2, y + lineHeight * 0.7);
            doc.text("Price", margin + colWidths[0] + colWidths[1] + 2, y + lineHeight * 0.7);
            doc.text("Total", margin + colWidths[0] + colWidths[1] + colWidths[2] + 2, y + lineHeight * 0.7);
            y += lineHeight;

            // --- Items Table Rows ---
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            invoice.items.forEach(item => {
                const itemPrice = item.tempPrice !== undefined ? item.tempPrice : item.price;
                doc.text(`${item.name} (${item.weight})`, margin + 2, y + lineHeight * 0.7);
                doc.text(item.quantity.toString(), margin + colWidths[0] + 2, y + lineHeight * 0.7);
                
                // FIX: Using "Rs. " as a reliable string prefix instead of the Rupee symbol (₹) 
                // to prevent the '1' or box error in basic jsPDF fonts.
                const formattedPrice = `Rs. ${Number(itemPrice).toFixed(2)}`;
                const formattedTotal = `Rs. ${Number(itemPrice * item.quantity).toFixed(2)}`;
                
                doc.text(formattedPrice, margin + colWidths[0] + colWidths[1] + 2, y + lineHeight * 0.7);
                doc.text(formattedTotal, margin + colWidths[0] + colWidths[1] + colWidths[2] + 2, y + lineHeight * 0.7);
                y += lineHeight;
            });
            y += lineHeight;

            // --- Total Summary ---
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0); // Black color for Total text
            
            // Total Label - positioned to the left of the Total Amount
            doc.text("Total Amount (Incl. all taxes):", margin + colWidths[0] + colWidths[1] - 5, y); 
            
            // Total Amount - positioned right and wider to prevent overlap
            doc.setFontSize(14);
            doc.setTextColor(33, 150, 83); // Green color for amount
            // FIX: Using "Rs. " as reliable fallback
            const finalTotalFormatted = `Rs. ${Number(invoice.total).toFixed(2)}`; 
            doc.text(finalTotalFormatted, 180, y, { align: 'right' }); 
            
            y += lineHeight * 2;

            // --- Footer / Company Info ---
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(100, 100, 100); // Gray

            // Information from image/settings (FSSAI, Address, Phone)
            doc.text(`FSSAI No: ${company.fssai}`, margin, y);
            y += lineHeight * 0.8;
            doc.text(`Address: ${company.address}`, margin, y, { maxWidth: 180 });
            y += lineHeight * 0.8;
            doc.text(`Contact: ${company.phone}`, margin, y);
            y += lineHeight * 1.5;
            
            doc.text("Thank you for your business!", margin, y);
            
            // Save PDF
            doc.save(`Invoice_${invoice.invoiceNumber}_${invoice.customerName}.pdf`);
        }

        function shareInvoiceWhatsApp(invoice) {
            const companyName = currentState.settings.companyInfo.name;
            const message = `*${companyName} Invoice*\n` +
                            `Invoice No: ${invoice.invoiceNumber}\n` +
                            `Customer: ${invoice.customerName}\n` +
                            `Date: ${invoice.date}\n\n` +
                            `*Order Details:*\n` +
                            invoice.items.map(item => {
                                const price = item.tempPrice !== undefined ? item.tempPrice : item.price;
                                return `- ${item.name} x ${item.quantity} (${formatCurrency(price * item.quantity)})`;
                            }).join('\n') +
                            `\n\n*TOTAL AMOUNT DUE: ${formatCurrency(invoice.total)}*\n\n` +
                            `Thank you for shopping with us!`;

            const encodedMessage = encodeURIComponent(message);
            // Uses web.whatsapp.com for desktop compatibility and mobile deep linking
            window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
        }

        function calculateReportData() {
            let totalRevenue = 0;
            let productSales = {}; // { productId: { name, totalQuantity } }
            let dailySales = {}; // { dateString: totalRevenue }

            currentState.invoices.forEach(invoice => {
                totalRevenue += invoice.total;

                // Daily Sales
                const dateKey = new Date(invoice.date).toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
                dailySales[dateKey] = (dailySales[dateKey] || 0) + invoice.total;

                // Product Sales
                invoice.items.forEach(item => {
                    if (!productSales[item.productId]) {
                        productSales[item.productId] = {
                            name: item.name,
                            totalQuantity: 0
                        };
                    }
                    productSales[item.productId].totalQuantity += item.quantity;
                });
            });

            const topSellingProducts = Object.values(productSales).sort((a, b) => b.totalQuantity - a.totalQuantity);

            return {
                totalRevenue,
                totalInvoices: currentState.invoices.length,
                dailySales,
                topSellingProducts
            };
        }

        function openCustomerModal(customerId = null) {
            const modal = document.getElementById('customer-modal');
            const form = document.getElementById('customer-form');
            form.reset();
            document.getElementById('customer-id').value = customerId || '';

            if (customerId) {
                const customer = currentState.customers.find(c => c.id === customerId);
                if (customer) {
                    document.getElementById('c-name').value = customer.name;
                    document.getElementById('c-phone').value = customer.phone;
                    document.getElementById('c-place').value = customer.place;
                    document.getElementById('c-details').value = customer.details;
                    document.getElementById('c-modal-title').textContent = 'Edit Customer';
                }
            } else {
                document.getElementById('c-modal-title').textContent = 'Add New Customer';
            }

            modal.classList.remove('hidden');
        }

        function closeCustomerModal() {
            document.getElementById('customer-modal').classList.add('hidden');
        }

        function saveCustomer(event) {
            event.preventDefault();
            const id = document.getElementById('customer-id').value;
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const place = document.getElementById('c-place').value.trim();
            const details = document.getElementById('c-details').value.trim();

            if (!name) { showMessage('Customer name is required.'); return; }

            const customerData = { name, phone, place, details };

            if (id) {
                // Edit
                const index = currentState.customers.findIndex(c => c.id === id);
                if (index > -1) {
                    currentState.customers[index] = { ...currentState.customers[index], ...customerData };
                    showMessage('Customer updated successfully!');
                }
            } else {
                // Add
                const newCustomer = { id: generateId(), ...customerData };
                currentState.customers.push(newCustomer);
                showMessage('Customer added successfully!');
            }

            saveCustomers();
            closeCustomerModal();
            renderView();
        }

        function deleteCustomer(id) {
            if (confirm('Are you sure you want to delete this customer record?')) {
                currentState.customers = currentState.customers.filter(c => c.id !== id);
                saveCustomers();
                showMessage('Customer deleted.');
                renderView();
            }
        }

                                </div>
                                <div>
                                    <label for="c-place" class="block text-sm font-medium text-gray-700">Place/City</label>
                                    <input type="text" id="c-place" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">
                                </div>
                            </div>
                             <div class="mb-4">
                                <label for="c-details" class="block text-sm font-medium text-gray-700">Details/Notes</label>
                                <textarea id="c-details" rows="2" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border"></textarea>
                            </div>
                            <div class="flex justify-end space-x-3 mt-6">
                                <button type="button" onclick="closeCustomerModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300">Cancel</button>
                                <button type="submit" class="px-4 py-2 text-sm font-medium bg-green-500 text-white rounded-md hover:bg-green-600">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        // --- 7. SETTINGS VIEW ---

        function renderSettingsView() {
            const settingsDiv = document.createElement('div');
            settingsDiv.className = 'py-4';
            const company = currentState.settings.companyInfo;
            const link = currentState.settings.googleSheetLink;

            settingsDiv.innerHTML = `
                <h3 class="text-2xl font-semibold mb-6 text-gray-800">Settings</h3>

                <!-- Company Info Section -->
                <div class="bg-white p-6 rounded-xl shadow mb-8">
                    <h4 class="text-xl font-bold mb-4 text-green-600">Invoice Information (Tara Home Products)</h4>
                    <form id="company-info-form" onsubmit="saveCompanyInfo(event)">
                        <div class="mb-4">
                            <label for="fssai" class="block text-sm font-medium text-gray-700">FSSAI Number</label>
                            <input type="text" id="fssai" value="${company.fssai}" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">
                        </div>
                        <div class="mb-4">
                            <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                            <textarea id="address" rows="2" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">${company.address}</textarea>
                        </div>
                        <div class="mb-6">
                            <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                            <input type="tel" id="phone" value="${company.phone}" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">
                        </div>
                        <button type="submit" class="btn-primary w-full">Update Company Info</button>
                    </form>
                </div>
                
                <!-- Backup Link Section -->
                <div class="bg-white p-6 rounded-xl shadow">
                    <h4 class="text-xl font-bold mb-4 text-yellow-600">Google Sheets Backup Link (Future Sync)</h4>
                    <form id="backup-link-form" onsubmit="saveBackupLink(event)">
                        <div class="mb-6">
                            <label for="backup-link" class="block text-sm font-medium text-gray-700">Google Sheet URL</label>
                            <input type="url" id="backup-link" value="${link}" placeholder="e.g., https://docs.google.com/spreadsheets/d/..." class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 p-2 border">
                            <p class="text-xs text-gray-500 mt-1">This link will be used for data synchronization in a future update.</p>
                        </div>
                        <button type="submit" class="bg-yellow-500 text-white p-3 rounded-xl hover:bg-yellow-600 transition-colors w-full font-medium">Save Backup Link</button>
                    </form>
                </div>
            `;
            return settingsDiv;
        }

        function saveCompanyInfo(event) {
            event.preventDefault();
            const fssai = document.getElementById('fssai').value.trim();
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();

            currentState.settings.companyInfo.fssai = fssai;
            currentState.settings.companyInfo.address = address;
            currentState.settings.companyInfo.phone = phone;

            saveSettings();
            showMessage('Company information updated successfully!');
            renderView();
        }

        function saveBackupLink(event) {
            event.preventDefault();
            const link = document.getElementById('backup-link').value.trim();
            currentState.settings.googleSheetLink = link;
            saveSettings();
            showMessage('Google Sheet Backup Link saved.');
            renderView();
        }

        // --- INITIALIZATION ---

        window.onload = function() {
            loadState();
            renderView();
        };

        // Initialize state on load
        loadState();
        renderView(); // Initial render
    </script>
</body>
</html>
