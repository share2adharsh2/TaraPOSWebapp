<!doctype html> 
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaraPOS — final (WebView compatible)</title>

  <!-- Static Tailwind (prebuilt) - works offline / file:// -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

:root {
  --vh: 1vh;
}
body {
  min-height: calc(var(--vh, 1vh) * 100);
}
window.addEventListener('resize', () => {
  document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
});

    #home-btn-fixed {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 100;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  padding: 6px 10px;
  font-size: 18px;
}

    :root{ --green:#10B981; --gold:#FFD700; --card:#fff; }
    html,body{height:100%; margin:0; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
    body{ background: linear-gradient(180deg,#f8fff8 0%, #ffffff 100%); color:#0f172a; }
    .logo{ font-family:"Playfair Display", serif; color:var(--gold); font-size:1.6rem; font-weight:600; }
    .tile{ border-radius:12px; padding:18px; background:var(--card); box-shadow:0 8px 18px rgba(2,6,23,0.06); border:1px solid rgba(16,185,129,0.06); cursor:pointer; transition:transform .12s ease; }
    .tile:hover{ transform:translateY(-6px); }
    .btn-primary{ background:var(--green); color:#fff; padding:.5rem .8rem; border-radius:10px; display:inline-block; }
    .card{ background:var(--card); border-radius:12px; padding:12px; box-shadow: 0 6px 18px rgba(2,6,23,0.04); }
    .small-muted{ font-size:.85rem; color:#6b7280; }
    .modal-backdrop{ position:fixed; inset:0; background:rgba(15,23,42,0.55); display:flex; align-items:center; justify-content:center; z-index:80; }
    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:80px; background:var(--green); color:white; padding:10px 14px; border-radius:8px; display:none; z-index:90; }
    input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance: none; margin:0; }
    /* small helper so qr images in modal look tidy */
    .qr-thumb{ width:80px; height:80px; object-fit:cover; border-radius:6px; border:1px solid #eee; }
    header {
      margin-left: 50px;
      margin-top: 10px;
    }
/* 🏠 Larger, clear Home button */
#home-btn {
  position: relative;
  top: -10px;
  left: -35px;
  font-size: 32px !important;   /* increased size */
  background: none;
  border: none;
  color: #0f172a;
  cursor: pointer;
  z-index: 99;
  transition: transform 0.15s ease, color 0.15s ease;
}



header {
  margin-left: 25px !important;
  margin-top: -20px !important;
}


  </style>
</head>
<body>
  <button id="home-btn-fixed" title="Home"></button>
  <div class="max-w-3xl mx-auto p-4">
<header class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-3">
    <!-- 🏠 Home Button in Header -->
    <button id="home-btn" title="Home" class="text-2xl hover:text-green-600 transition">🏠</button>
    <div>
      <div class="logo">TARA</div>
      <div class="small-muted">Tara Home Products • POS</div>
    </div>
  </div>

  <div class="text-right flex items-center gap-3">
    <div class="small-muted">Device</div>
    <div id="device-id" class="font-medium"></div>
  </div>
</header>




    <main id="app" class="space-y-6"></main>

    <div id="toast" class="toast"></div>
  </div>

<script>
/* POS - compatibility-first JS (no optional-chaining on LHS; no arrow/destructuring in risky spots). */

/* LocalStorage keys and defaults */
var LS = window.localStorage;

function initDefaults() {
  if(!LS.getItem('tara_products')) {
    LS.setItem('tara_products', JSON.stringify([
      { id: 'p1', name:'Mango Pickle', weight:'250g', price:100, details:'Sample' },
      { id: 'p2', name:'Garlic Pickle', weight:'250g', price:100, details:'Sample' }
    ]));
  }
  if(!LS.getItem('tara_customers')) LS.setItem('tara_customers', JSON.stringify([]));
  if(!LS.getItem('tara_invoices')) LS.setItem('tara_invoices', JSON.stringify([]));
  if(!LS.getItem('tara_settings')) LS.setItem('tara_settings', JSON.stringify({
    companyInfo:{ name:'Tara Home Products', address:'', phone:'', phone2:'', email:'', instagram:'', fssai:'' },
    upi_qr:null, insta_qr:null,
    /* backward-compatible defaults - individual toggles */
    show_qrs:true,
    show_upi_qr:true,
    show_insta_qr:true
  }));
  else {
    // ensure new flags exist if user had older settings
    try {
      var s = JSON.parse(LS.getItem('tara_settings') || '{}');
      if(typeof s.show_upi_qr === 'undefined') s.show_upi_qr = (typeof s.show_qrs !== 'undefined' ? s.show_qrs : true);
      if(typeof s.show_insta_qr === 'undefined') s.show_insta_qr = (typeof s.show_qrs !== 'undefined' ? s.show_qrs : true);
      if(typeof s.upi_qr === 'undefined') s.upi_qr = null;
      if(typeof s.insta_qr === 'undefined') s.insta_qr = null;
      LS.setItem('tara_settings', JSON.stringify(s));
    } catch(e){}
  }
  if(!LS.getItem('tara_stock')) LS.setItem('tara_stock', JSON.stringify([]));
  if(!LS.getItem('tara_purchases')) LS.setItem('tara_purchases', JSON.stringify([]));
  if(!LS.getItem('tara_deleted_sales')) LS.setItem('tara_deleted_sales', JSON.stringify([]));
  if(!LS.getItem('tara_invoice_counter')) LS.setItem('tara_invoice_counter','0');
  if(!LS.getItem('device_id')) LS.setItem('device_id','DEV' + Math.random().toString(36).slice(2,6).toUpperCase());
}
initDefaults();

/* App state */
var state = {
  view: 'home',
  products: JSON.parse(LS.getItem('tara_products') || '[]'),
  customers: JSON.parse(LS.getItem('tara_customers') || '[]'),
  invoices: JSON.parse(LS.getItem('tara_invoices') || '[]'),
  settings: JSON.parse(LS.getItem('tara_settings') || '{}'),
  stock: JSON.parse(LS.getItem('tara_stock') || '[]'),
  purchases: JSON.parse(LS.getItem('tara_purchases') || '[]'),
  currentSale: { customerName:'', cart:[] },
  lastReport: null
};

function persist() {
  LS.setItem('tara_products', JSON.stringify(state.products));
  LS.setItem('tara_customers', JSON.stringify(state.customers));
  LS.setItem('tara_invoices', JSON.stringify(state.invoices));
  LS.setItem('tara_settings', JSON.stringify(state.settings));
  LS.setItem('tara_stock', JSON.stringify(state.stock));
  LS.setItem('tara_purchases', JSON.stringify(state.purchases));
}

/* Utilities */
function genId(prefix) { return (prefix||'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function formatCurrency(v) { return new Intl.NumberFormat('en-IN',{ style:'currency', currency:'INR', minimumFractionDigits:2 }).format(Number(v||0)); }
function today_ddmmyy() { var d=new Date(); var dd=('0'+d.getDate()).slice(-2), mm=('0'+(d.getMonth()+1)).slice(-2), yy=(''+d.getFullYear()).slice(-2); return dd+'-'+mm+'-'+yy; }
function nextInvoiceNumber() { var c=parseInt(LS.getItem('tara_invoice_counter')||'0',10); if(isNaN(c)) c=0; c++; LS.setItem('tara_invoice_counter', String(c)); return 'PO100' + String(c) + '_INVOICE_' + today_ddmmyy(); }
function showToast(msg, ms) { ms = ms || 1800; var t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(function(){ t.style.display = 'none'; }, ms); }

/* Navigation */
function navigate(view) { state.view = view; render(); try{ history.pushState({v:view}, '', '#'+view); }catch(e){} }
window.addEventListener('popstate', function(){ navigate('home'); });

document.getElementById('device-id').textContent = LS.getItem('device_id') || '';

/* wire header home button */
document.getElementById('home-btn-fixed').addEventListener('click', function(){ navigate('home'); });


/* Render root */
function render() {
  var app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = '';
  if(state.view === 'home') app.appendChild(renderHome());
  else if(state.view === 'products') app.appendChild(renderProducts());
  else if(state.view === 'sales') app.appendChild(renderSales());
  else if(state.view === 'invoices') app.appendChild(renderInvoices());
  else if(state.view === 'reports') app.appendChild(renderReports());
  else if(state.view === 'customers') app.appendChild(renderCustomers());
  else if(state.view === 'stock') app.appendChild(renderStock());
  else if(state.view === 'purchases') app.appendChild(renderPurchases());
  else if(state.view === 'settings') app.appendChild(renderSettings());
  else app.appendChild(renderHome());
}

/* --- Home --- */
function renderHome() {
  var wrap = document.createElement('div'); wrap.className='space-y-4';
  var grid = document.createElement('div'); grid.className='grid grid-cols-2 sm:grid-cols-3 gap-4';
  var tiles = [
    {name:'New Sale', view:'sales'}, {name:'Products', view:'products'}, {name:'Invoices', view:'invoices'},
    {name:'Reports', view:'reports'}, {name:'Customers', view:'customers'}, {name:'Stock', view:'stock'},
    {name:'Purchases', view:'purchases'}, {name:'Settings', view:'settings'}
  ];
  for(var i=0;i<tiles.length;i++){
    (function(t){
      var el = document.createElement('div'); el.className='tile';
      var h = document.createElement('div'); h.className='font-semibold'; h.textContent = t.name;
      el.appendChild(h);
      el.addEventListener('click', function(){ navigate(t.view); });
      grid.appendChild(el);
    })(tiles[i]);
  }
  wrap.appendChild(grid);

  var recent = document.createElement('div'); recent.className='mt-4';
  var head = document.createElement('div'); head.className='font-medium mb-2'; head.textContent='Recent Sales';
  recent.appendChild(head);

  if(state.invoices && state.invoices.length){
    var list = document.createElement('div'); list.className='space-y-2';
    var recentInv = state.invoices.slice(-5).reverse();
    for(var k=0;k<recentInv.length;k++){
      var iObj = recentInv[k];
      var row = document.createElement('div'); row.className='card flex justify-between items-center';
      var left = document.createElement('div');
      var title = document.createElement('div'); title.className='font-semibold'; title.textContent = iObj.invoiceNumber;
      var when = document.createElement('div'); when.className='small-muted'; when.textContent = (new Date(iObj.date)).toLocaleString();
      left.appendChild(title); left.appendChild(when);
      var right = document.createElement('div'); right.className='text-right';
      var amt = document.createElement('div'); amt.className='font-bold'; amt.textContent = formatCurrency(iObj.total);
      right.appendChild(amt);
      row.appendChild(left); row.appendChild(right);
      list.appendChild(row);
    }
    recent.appendChild(list);
  } else {
    var empty = document.createElement('div'); empty.className='text-gray-500 p-3 card'; empty.textContent='No recent sales';
    recent.appendChild(empty);
  }

  wrap.appendChild(recent);
  return wrap;
}

/* --- Products --- */
function renderProducts() {
  var container = document.createElement('div'); container.className='space-y-4';
  var head = document.createElement('div'); head.className='flex justify-between items-center';
  var h = document.createElement('h3'); h.className='text-lg font-semibold'; h.textContent='Products';
  var addBtn = document.createElement('button'); addBtn.className='btn-primary'; addBtn.textContent='Add';
  addBtn.addEventListener('click', function(){ openProductModal(null); });
  head.appendChild(h); head.appendChild(addBtn);
  container.appendChild(head);

  var list = document.createElement('div'); list.id='product-list'; list.className='space-y-3';
  for(var i=0;i<state.products.length;i++){
    (function(p){
      var row = document.createElement('div'); row.className='card flex justify-between items-center';
      var left = document.createElement('div');
      var title = document.createElement('div'); title.className='font-semibold'; title.textContent = p.name;
      var meta = document.createElement('div'); meta.className='small-muted'; meta.textContent = (p.weight? p.weight + ' • ' : '') + formatCurrency(p.price);
      left.appendChild(title); left.appendChild(meta);
      var right = document.createElement('div'); right.className='flex gap-2';
      var edit = document.createElement('button'); edit.className='px-3 py-1 bg-green-50 text-green-600 rounded'; edit.textContent='Edit';
      edit.addEventListener('click', function(){ openProductModal(p.id); });
      var del = document.createElement('button'); del.className='px-3 py-1 bg-red-50 text-red-600 rounded'; del.textContent='Delete';
      del.addEventListener('click', function(){ if(confirm('Delete product?')){ deleteProduct(p.id); } });
      right.appendChild(edit); right.appendChild(del);
      row.appendChild(left); row.appendChild(right);
      list.appendChild(row);
    })(state.products[i]);
  }
  container.appendChild(list);
  return container;
}

function openProductModal(id) {
  closeModal('modal-product');
  var modal = document.createElement('div'); modal.className='modal-backdrop'; modal.id='modal-product';
  var card = document.createElement('div'); card.className='card w-full max-w-md';
  var title = document.createElement('h4'); title.className='font-semibold mb-2'; title.textContent = id ? 'Edit Product' : 'New Product';
  card.appendChild(title);

  // form fields
  var form = document.createElement('div'); form.className='space-y-2';
  var nameGroup = document.createElement('div'); var nameLabel = document.createElement('label'); nameLabel.className='small-muted'; nameLabel.textContent='Name';
  var nameInput = document.createElement('input'); nameInput.id='m-prod-name'; nameInput.className='w-full p-2 border rounded';
  nameGroup.appendChild(nameLabel); nameGroup.appendChild(nameInput);

  var row = document.createElement('div'); row.className='grid grid-cols-2 gap-2';
  var wG = document.createElement('div'); var wLabel = document.createElement('label'); wLabel.className='small-muted'; wLabel.textContent='Weight';
  var wInput = document.createElement('input'); wInput.id='m-prod-weight'; wInput.className='w-full p-2 border rounded';
  wG.appendChild(wLabel); wG.appendChild(wInput);
  var pG = document.createElement('div'); var pLabel = document.createElement('label'); pLabel.className='small-muted'; pLabel.textContent='Price';
  var pInput = document.createElement('input'); pInput.id='m-prod-price'; pInput.type='number'; pInput.className='w-full p-2 border rounded';
  pG.appendChild(pLabel); pG.appendChild(pInput);
  row.appendChild(wG); row.appendChild(pG);

  var detailsGroup = document.createElement('div'); var dLabel = document.createElement('label'); dLabel.className='small-muted'; dLabel.textContent='Details';
  var dInput = document.createElement('textarea'); dInput.id='m-prod-details'; dInput.className='w-full p-2 border rounded';
  detailsGroup.appendChild(dLabel); detailsGroup.appendChild(dInput);

  form.appendChild(nameGroup); form.appendChild(row); form.appendChild(detailsGroup);
  card.appendChild(form);

  // buttons
  var btnRow = document.createElement('div'); btnRow.className='flex justify-end gap-2 mt-3';
  var cancel = document.createElement('button'); cancel.className='px-3 py-2 bg-gray-100 rounded'; cancel.textContent='Cancel';
  cancel.addEventListener('click', function(){ closeModal('modal-product'); });
  var save = document.createElement('button'); save.className='btn-primary'; save.textContent='Save';
  save.addEventListener('click', function(){ saveProductModal(id, nameInput.value, wInput.value, pInput.value, dInput.value); });
  btnRow.appendChild(cancel); btnRow.appendChild(save);
  card.appendChild(btnRow);

  modal.appendChild(card);
  document.body.appendChild(modal);

  // populate if editing
  if(id) {
    var p = null;
    for(var i=0;i<state.products.length;i++){ if(state.products[i].id === id){ p = state.products[i]; break; } }
    if(p){
      nameInput.value = p.name || '';
      wInput.value = p.weight || '';
      pInput.value = p.price || '';
      dInput.value = p.details || '';
    }
  }
}

function saveProductModal(id, name, weight, price, details) {
  name = (name || '').trim();
  price = Number(price || 0);
  if(!name || isNaN(price) || price <= 0){ showToast('Enter name and price'); return; }
  if(id) {
    for(var i=0;i<state.products.length;i++){ if(state.products[i].id === id){ state.products[i].name = name; state.products[i].weight = weight; state.products[i].price = price; state.products[i].details = details; break; } }
  } else {
    state.products.push({ id: genId('prod'), name: name, weight: weight, price: price, details: details });
  }
  persist(); closeModal('modal-product'); showToast('Product saved'); render();
}

function deleteProduct(id) {
  var out = [];
  for(var i=0;i<state.products.length;i++){ if(state.products[i].id !== id) out.push(state.products[i]); }
  state.products = out;
  persist(); render();
}

/* --- Customers --- */
function renderCustomers() {
  var cont = document.createElement('div'); cont.className='space-y-4';
  var head = document.createElement('div'); head.className='flex justify-between items-center';
  var h = document.createElement('h3'); h.className='text-lg font-semibold'; h.textContent='Customers';
  var add = document.createElement('button'); add.className='btn-primary'; add.textContent='Add';
  add.addEventListener('click', function(){ openCustomerModal(null); });
  head.appendChild(h); head.appendChild(add);
  cont.appendChild(head);

  var list = document.createElement('div'); list.className='space-y-3';
  if(state.customers.length === 0) {
    var empty = document.createElement('div'); empty.className='text-gray-500 card'; empty.textContent='No customers';
    list.appendChild(empty);
  } else {
    for(var i=0;i<state.customers.length;i++){
      (function(c){
        var row = document.createElement('div'); row.className='card flex justify-between items-center';
        var left = document.createElement('div');
        var name = document.createElement('div'); name.className='font-semibold'; name.textContent = c.name;
        var meta = document.createElement('div'); meta.className='small-muted'; meta.textContent = c.phone || '';
        left.appendChild(name); left.appendChild(meta);
        var right = document.createElement('div'); right.className='flex gap-2';
        var edit = document.createElement('button'); edit.className='px-3 py-1 bg-green-50 text-green-600 rounded'; edit.textContent='Edit';
        edit.addEventListener('click', function(){ openCustomerModal(c.id); });
        var del = document.createElement('button'); del.className='px-3 py-1 bg-red-50 text-red-600 rounded'; del.textContent='Delete';
        del.addEventListener('click', function(){ if(confirm('Delete customer?')){ deleteCustomer(c.id); } });
        right.appendChild(edit); right.appendChild(del);
        row.appendChild(left); row.appendChild(right);
        list.appendChild(row);
      })(state.customers[i]);
    }
  }
  cont.appendChild(list);
  return cont;
}

function openCustomerModal(id) {
  closeModal('modal-cust');
  var modal = document.createElement('div'); modal.className='modal-backdrop'; modal.id='modal-cust';
  var card = document.createElement('div'); card.className='card w-full max-w-md';
  var title = document.createElement('h4'); title.className='font-semibold mb-2'; title.textContent = id ? 'Edit Customer' : 'New Customer';
  card.appendChild(title);

  var form = document.createElement('div'); form.className='space-y-2';
  var nmG = document.createElement('div'); var nmL = document.createElement('label'); nmL.className='small-muted'; nmL.textContent='Name'; var nmI = document.createElement('input'); nmI.id='m-cust-name'; nmI.className='w-full p-2 border rounded';
  nmG.appendChild(nmL); nmG.appendChild(nmI);

  var row = document.createElement('div'); row.className='grid grid-cols-2 gap-2';
  var phG = document.createElement('div'); var phL = document.createElement('label'); phL.className='small-muted'; phL.textContent='Phone'; var phI = document.createElement('input'); phI.id='m-cust-phone'; phI.className='w-full p-2 border rounded';
  phG.appendChild(phL); phG.appendChild(phI);
  var placeG = document.createElement('div'); var plL = document.createElement('label'); plL.className='small-muted'; plL.textContent='Place'; var plI = document.createElement('input'); plI.id='m-cust-place'; plI.className='w-full p-2 border rounded';
  placeG.appendChild(plL); placeG.appendChild(plI);
  row.appendChild(phG); row.appendChild(placeG);

  var notes = document.createElement('div'); var noteL = document.createElement('label'); noteL.className='small-muted'; noteL.textContent='Notes'; var noteI = document.createElement('textarea'); noteI.id='m-cust-notes'; noteI.className='w-full p-2 border rounded';
  notes.appendChild(noteL); notes.appendChild(noteI);

  form.appendChild(nmG); form.appendChild(row); form.appendChild(notes);
  card.appendChild(form);

  var btnRow = document.createElement('div'); btnRow.className='flex justify-end gap-2 mt-3';
  var cancel = document.createElement('button'); cancel.className='px-3 py-2 bg-gray-100 rounded'; cancel.textContent='Cancel'; cancel.addEventListener('click', function(){ closeModal('modal-cust'); });
  var save = document.createElement('button'); save.className='btn-primary'; save.textContent='Save'; save.addEventListener('click', function(){ saveCustomerModal(id, nmI.value, phI.value, plI.value, noteI.value); });
  btnRow.appendChild(cancel); btnRow.appendChild(save);
  card.appendChild(btnRow);
  modal.appendChild(card); document.body.appendChild(modal);

  if(id) {
    var c = null; for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id === id){ c = state.customers[i]; break; } }
    if(c){ nmI.value = c.name || ''; phI.value = c.phone || ''; plI.value = c.place || ''; noteI.value = c.details || ''; }
  }
}

function saveCustomerModal(id, name, phone, place, notes) {
  name = (name||'').trim();
  if(!name){ showToast('Name required'); return; }
  if(id){
    for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id === id){ state.customers[i].name = name; state.customers[i].phone = phone; state.customers[i].place = place; state.customers[i].details = notes; break; } }
  } else {
    state.customers.push({ id: genId('cust'), name: name, phone: phone, place: place, details: notes });
  }
  persist(); closeModal('modal-cust'); showToast('Customer saved'); render();
}

function deleteCustomer(id){
  var out=[]; for(var i=0;i<state.customers.length;i++){ if(state.customers[i].id !== id) out.push(state.customers[i]); }
  state.customers = out; persist(); showToast('Customer deleted'); render();
}

/* --- Sales --- */
function renderSales() {
  var cont = document.createElement('div'); cont.className='space-y-4';
  var title = document.createElement('h3'); title.className='text-lg font-semibold'; title.textContent='New Sale';
  cont.appendChild(title);

  // Customer input
  var custCard = document.createElement('div'); custCard.className='card';
  var custLabel = document.createElement('label'); custLabel.className='small-muted'; custLabel.textContent='Customer';
  var custInput = document.createElement('input'); custInput.id='sale-customer'; custInput.className='w-full p-2 border rounded'; custInput.value = state.currentSale.customerName || '';
  custCard.appendChild(custLabel); custCard.appendChild(custInput);

  // Product select
  var prodCard = document.createElement('div'); prodCard.className='card';
  var prodLabel = document.createElement('label'); prodLabel.className='small-muted'; prodLabel.textContent='Product';
  var prodSelect = document.createElement('select'); prodSelect.id='sale-product'; prodSelect.className='w-full p-2 border rounded';
  var opt0 = document.createElement('option'); opt0.value=''; opt0.textContent='-- choose --'; prodSelect.appendChild(opt0);
  for(var i=0;i<state.products.length;i++){ var opt = document.createElement('option'); opt.value = state.products[i].id; opt.textContent = state.products[i].name + ' (' + formatCurrency(state.products[i].price) + ')'; prodSelect.appendChild(opt); }
  prodSelect.addEventListener('change', function(e){ if(e.target.value){ addToCart(e.target.value); e.target.value=''; } });
  prodCard.appendChild(prodLabel); prodCard.appendChild(prodSelect);

  cont.appendChild(custCard); cont.appendChild(prodCard);

      qtyInput.addEventListener('change', function(){ var q = parseInt(qtyInput.value||0,10); if(isNaN(q) || q<=0) changeCartQuantity(item.productId, 'del'); else setCartQuantity(item.productId, q); });
      var btnPlus = document.createElement('button'); btnPlus.className='px-2 py-1 bg-gray-100 rounded'; btnPlus.textContent='+';
      btnPlus.addEventListener('click', function(){ changeCartQuantity(item.productId, +1); });
      // Editable price input
var priceInput = document.createElement('input');
priceInput.type = 'number';
priceInput.className = 'w-20 text-center border rounded p-1';
priceInput.value = item.price;
priceInput.addEventListener('change', function(){
  var newPrice = parseFloat(priceInput.value);
  if(isNaN(newPrice) || newPrice <= 0) {
    showToast('Invalid price');
    priceInput.value = item.price;
    return;
  }
  item.price = newPrice; // temporary change for this cart
  updateCartUI(); // refresh totals
});
right.appendChild(priceInput);


      var btnRemove = document.createElement('button'); btnRemove.className='ml-3 text-red-600'; btnRemove.textContent='Remove';
      btnRemove.addEventListener('click', function(){ changeCartQuantity(item.productId, 'del'); });

      right.appendChild(btnMinus); right.appendChild(qtyInput); right.appendChild(btnPlus); right.appendChild(btnRemove);
      row.appendChild(left); row.appendChild(right);
      area.appendChild(row);
    })(state.currentSale.cart[i]);
  }

  var subtotal = 0;
  for(var j=0;j<state.currentSale.cart.length;j++){ subtotal += Number(state.currentSale.cart[j].price || 0) * Number(state.currentSale.cart[j].quantity || 0); }
  document.getElementById('sale-sub').textContent = formatCurrency(subtotal);
}

function addToCart(pid) {
  var prod = null; for(var i=0;i<state.products.length;i++){ if(state.products[i].id === pid){ prod = state.products[i]; break; } }
  if(!prod) return;
  var found=false;
  for(var j=0;j<state.currentSale.cart.length;j++){
    if(state.currentSale.cart[j].productId === pid){ state.currentSale.cart[j].quantity += 1; found=true; break; }
  }
  if(!found) state.currentSale.cart.push({ productId: pid, name: prod.name, weight: prod.weight, price: prod.price, quantity: 1 });
  persist(); updateCartUI();
}

function changeCartQuantity(pid, delta) {
  var idx=-1; for(var i=0;i<state.currentSale.cart.length;i++){ if(state.currentSale.cart[i].productId === pid){ idx=i; break; } }
  if(idx<0) return;
  if(delta === 'del'){ state.currentSale.cart.splice(idx,1); }
  else { var newQ = state.currentSale.cart[idx].quantity + Number(delta); if(newQ <= 0) state.currentSale.cart.splice(idx,1); else state.currentSale.cart[idx].quantity = newQ; }
  persist(); updateCartUI();
}

function setCartQuantity(pid, q) {
  var idx=-1; for(var i=0;i<state.currentSale.cart.length;i++){ if(state.currentSale.cart[i].productId === pid){ idx=i; break; } }
  if(idx<0) return;
  state.currentSale.cart[idx].quantity = q; persist(); updateCartUI();
}

function calcSaleTotals() {
  var subtotal = 0;
  for(var i=0;i<state.currentSale.cart.length;i++){ subtotal += Number(state.currentSale.cart[i].price || 0) * Number(state.currentSale.cart[i].quantity || 0); }
  var shipEl = document.getElementById('sale-shipping'); var ship = shipEl && shipEl.value ? parseFloat(shipEl.value) : 0;
  var discEl = document.getElementById('sale-discount'); var disc = discEl && discEl.value ? parseFloat(discEl.value) : 0;
  return { subtotal: subtotal, total: subtotal + (isNaN(ship)?0:ship) - (isNaN(disc)?0:disc), shipping: ship, discount: disc };
}

function startNewSale() {
  state.currentSale = { customerName:'', cart:[] };
  persist(); showToast('New sale'); render();
}

function generateInvoice() {
  if(!state.currentSale.cart || state.currentSale.cart.length === 0){ showToast('Cart empty'); return; }
  var custEl = document.getElementById('sale-customer'); var cust = custEl && custEl.value ? custEl.value.trim() : 'Cash Customer';
  var totals = calcSaleTotals();
  var inv = { id: genId('inv'), invoiceNumber: nextInvoiceNumber(), date: (new Date()).toISOString(), customerName: cust, items: JSON.parse(JSON.stringify(state.currentSale.cart)), subtotal: totals.subtotal, shipping_cost: totals.shipping, discount: totals.discount, total: totals.total, operator: LS.getItem('device_id') || '' };
  state.invoices.push(inv);
  // reduce stock quantities if exist
  for(var k=0;k<inv.items.length;k++){
    var it = inv.items[k];
    var sidx=-1; for(var s=0;s<state.stock.length;s++){ if(state.stock[s].product_id === it.productId){ sidx=s; break; } }
    if(sidx>=0){ state.stock[sidx].qty = Math.max(0, Number(state.stock[sidx].qty||0) - Number(it.quantity||0)); state.stock[sidx].updated_at = (new Date()).toISOString(); }
    else {
      // if no stock entry exists, we add with zero or negative? We'll create an entry with reduced qty (0 floor) to reflect decrease.
      state.stock.push({ stock_id: genId('stock'), product_id: it.productId, qty: Math.max(0, -Number(it.quantity||0)), updated_at: (new Date()).toISOString() });
    }
  }
  persist();
  state.currentSale = { customerName:'', cart:[] };
  showToast('Invoice generated: ' + inv.invoiceNumber);
  navigate('invoices');
}

/* download / share invoice (last) */
function downloadLastInvoice() {
  if(!state.invoices || state.invoices.length === 0){ showToast('No invoice'); return; }
  var inv = state.invoices[state.invoices.length - 1];
  generateInvoicePdf(inv, function(blob){
    var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = 'Invoice_' + inv.invoiceNumber + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast('Downloaded');
  });
}

function shareLastInvoice() {
  if(!state.invoices || state.invoices.length === 0){ showToast('No invoice'); return; }
  var inv = state.invoices[state.invoices.length - 1];
  generateInvoicePdf(inv, function(blob){
    try{
      if(navigator.canShare && navigator.canShare({ files: [ new File([blob], 'Invoice_' + inv.invoiceNumber + '.pdf', { type:'application/pdf' }) ] })){
        navigator.share({ files: [ new File([blob], 'Invoice_' + inv.invoiceNumber + '.pdf', { type:'application/pdf' }) ], title: 'Invoice ' + inv.invoiceNumber });
        return;
      }
    }catch(e){}
    // fallback to WhatsApp text
    shareViaWhatsApp(inv);
  });
}

function shareViaWhatsApp(inv) {
  var lines=[]; lines.push((state.settings.companyInfo && state.settings.companyInfo.name) ? state.settings.companyInfo.name : 'Tara'); lines.push('Invoice: ' + inv.invoiceNumber); lines.push('Total: ' + formatCurrency(inv.total)); lines.push('Items:');
  for(var i=0;i<inv.items.length;i++){ var it = inv.items[i]; lines.push(it.name + ' x' + it.quantity + ' - ' + formatCurrency(it.price*it.quantity)); }
  var url = 'https://wa.me/?text=' + encodeURIComponent(lines.join('\n'));
  window.open(url, '_blank');
}

/* PDF generation callback style (to support older runtime) */
/* Requirements implemented:
   - Printer-friendly: black text, white background
   - Footer: left = Payment QR + caption "Payment QR / UPI ID"
             right = Instagram QR + caption "View us on Instagram"
   - Below both: "Thank you for shopping with us!"
   - Respect settings.show_upi_qr and settings.show_insta_qr individually
   - Place QRs side-by-side at footer
*/
function generateInvoicePdf(inv, cb) {
  var jspdfGlobal = window.jspdf || window.jspdf;
  if(!jspdfGlobal || !jspdfGlobal.jsPDF) {
    var html = 'Invoice ' + inv.invoiceNumber + '\nTotal: ' + inv.total;
    var blob = new Blob([html], { type: 'text/plain' });
    cb(blob);
    return;
  }

  var jsPDF = jspdfGlobal.jsPDF;
  var doc = new jsPDF({ unit: 'pt', format: 'a4' });

  var margin = 50;                 // larger outer margin for a professional look
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();

  // Start positions
  var y = margin;
  var titleGap = 28;               // space after title
  var companyBlockHeight = 70;     // reserved block height for company info
  var metaBlockWidth = 200;        // width reserved on right for invoice meta
  var lineGap = 16;                // line gap for table rows

// Title - centered
doc.setFont('helvetica', 'bold');
doc.setFontSize(22);
doc.setTextColor(0, 0, 0);
var titleY = y + 20; // a bit lower from top
doc.text('INVOICE', pageWidth / 2, titleY, { align: 'center' });

// Add extra spacing below INVOICE
y = titleY + 50; // increased from ~30 to 50px gap

  // Company info box (left) - allow multi-line wrap
  var ci = (state.settings && state.settings.companyInfo) ? state.settings.companyInfo : {};
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  var compX = margin;
  var compY = y;
  var compName = ci.name || 'Tara Home Products';
  doc.text(compName, compX, compY);
  doc.setFont('helvetica', 'normal');
  var curY = compY + 14;

  // Prepare an address block that wraps if too long
  var availWidth = pageWidth - margin - metaBlockWidth - 30; // left column width
  if(ci.address) {
    var addrLines = doc.splitTextToSize(ci.address, availWidth);
    for(var ai=0; ai<addrLines.length; ai++){
      doc.text(String(addrLines[ai]), compX, curY);
      curY += 12;
    }
  }
  if(ci.phone) { doc.text('Phone: ' + ci.phone, compX, curY); curY += 12; }
  if(ci.email) { doc.text('Email: ' + ci.email, compX, curY); curY += 12; }
  // Ensure company block has fixed height so items won't overlap
  var companyBottom = compY + companyBlockHeight;
  if(curY > companyBottom - 6) companyBottom = curY + 6;

  // Invoice metadata (right)
  var metaX = pageWidth - margin - metaBlockWidth + 10;
  var metaY = y;
  doc.setFont('helvetica', 'bold');
  doc.text('Invoice No:', metaX, metaY);
  doc.setFont('helvetica', 'normal');
  doc.text(inv.invoiceNumber || '-', metaX + 78, metaY);
  metaY += 16;
  doc.setFont('helvetica', 'bold');
  doc.text('Date:', metaX, metaY);
  doc.setFont('helvetica', 'normal');
  doc.text((new Date(inv.date)).toLocaleString(), metaX + 78, metaY);
  metaY += 14;


  // Move y to below company/meta block plus a little space
  y = companyBottom + 18;

  // Separator line
  doc.setLineWidth(0.6);
  doc.line(margin, y, pageWidth - margin, y);
  y += 18;

  // Customer label (left)
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Bill To:', margin, y);
  doc.setFont('helvetica', 'normal');
  doc.text(inv.customerName || 'Cash Customer', margin + 60, y);
  y += 22;

  // Table header
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  var colItemX = margin;
  var colQtyX = pageWidth - margin - 200;
  var colRateX = pageWidth - margin - 120;
  var colAmountX = pageWidth - margin;
  doc.text('Item', colItemX, y);
  doc.text('Qty', colQtyX, y, { align: 'right' });
  doc.text('Rate', colRateX, y, { align: 'right' });
  doc.text('Amount', colAmountX, y, { align: 'right' });
  y += 8;
  doc.setLineWidth(0.35);
  doc.line(margin, y, pageWidth - margin, y);
  y += 14;

  // Table rows
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  for(var i=0; i<inv.items.length; i++){
    var it = inv.items[i];
    var itemName = it.name + (it.weight ? ' (' + it.weight + ')' : '');
    // wrap item name if too long
    var wrapped = doc.splitTextToSize(itemName, colQtyX - colItemX - 8);
    for(var wi=0; wi<wrapped.length; wi++){
      doc.text(wrapped[wi], colItemX, y);
      if(wi === 0) {
        doc.text(String(it.quantity), colQtyX, y, { align: 'right' });
        doc.text(Number(it.price).toFixed(2), colRateX, y, { align: 'right' });
        doc.text(Number((it.price * it.quantity)).toFixed(2), colAmountX, y, { align: 'right' });
      }
      y += lineGap - 4;
      if(y > pageHeight - 160){
        doc.addPage();
        y = margin + 20;
      }
    }
  }

  // Totals
  y += 6;
  doc.line(margin, y, pageWidth - margin, y);
  y += 12;
  doc.setFontSize(11);
  var totRightX = pageWidth - margin;
  doc.setFont('helvetica', 'normal');
  doc.text('Subtotal', totRightX - 120, y, { align: 'right' });
  doc.text(Number(inv.subtotal || 0).toFixed(2), totRightX, y, { align: 'right' }); y += 16;
  if(inv.shipping_cost && Number(inv.shipping_cost) > 0){
    doc.text('Shipping', totRightX - 120, y, { align: 'right' });
    doc.text(Number(inv.shipping_cost).toFixed(2), totRightX, y, { align: 'right' }); y += 16;
  }
  if(inv.discount && Number(inv.discount) > 0){
    doc.text('Discount', totRightX - 120, y, { align: 'right' });
    doc.text('-' + Number(inv.discount).toFixed(2), totRightX, y, { align: 'right' }); y += 16;
  }
  doc.setFont('helvetica', 'bold');
  doc.text('Total (Rs.)', totRightX - 120, y, { align: 'right' });
  doc.text(Number(inv.total || 0).toFixed(2), totRightX, y, { align: 'right' });
  y += 26;

  // Footer area: QRs at left & right, thank-you centered
  var footerY = pageHeight - 120;
  var qrSize = 84;
  var showUpi = !!(state.settings && state.settings.show_upi_qr);
  var showInsta = !!(state.settings && state.settings.show_insta_qr);
  var upiImg = (state.settings && state.settings.upi_qr) ? state.settings.upi_qr : null;
  var instaImg = (state.settings && state.settings.insta_qr) ? state.settings.insta_qr : null;

  // Left QR (UPI)
  if(showUpi && upiImg){
    try { doc.addImage(upiImg, 'PNG', margin, footerY, qrSize, qrSize); } catch(e){}
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Payment QR / UPI ID', margin + qrSize / 2, footerY + qrSize + 12, { align: 'center' });
  }

  // Right QR (Insta)
  if(showInsta && instaImg){
    try { doc.addImage(instaImg, 'PNG', pageWidth - margin - qrSize, footerY, qrSize, qrSize); } catch(e){}
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Follow us on Instagram', pageWidth - margin - qrSize / 2, footerY + qrSize + 12, { align: 'center' });
  }

  // Thank you centered between QRs
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Thank you for shopping with us!', pageWidth / 2, footerY + qrSize + 30, { align: 'center' });

  // Output PDF
  var uint8 = doc.output('arraybuffer');
  var blob = new Blob([uint8], { type: 'application/pdf' });
  cb(blob);
}

/* Modify deleteInvoice: push to deleted_sales (already present) */
function deleteInvoice(id) {
  if(!confirm('Delete invoice?')) return;
  var idx = -1; for(var i=0;i<state.invoices.length;i++){ if(state.invoices[i].id === id){ idx=i; break; } }
  if(idx < 0){ showToast('Not found'); return; }
  var rec = state.invoices.splice(idx,1)[0];
  // push to deleted_sales (include deleted_at and snapshot)
  var del = JSON.parse(LS.getItem('tara_deleted_sales') || '[]');
  del.push({ id: genId('delsale'), invoiceId: rec.id, deleted_at: (new Date()).toISOString(), snapshot: rec });
  LS.setItem('tara_deleted_sales', JSON.stringify(del));
  // restore stock (as before) when deleting invoice: add quantities back
  for(var j=0;j<rec.items.length;j++){
    var it = rec.items[j];
    var sidx=-1; for(var s=0;s<state.stock.length;s++){ if(state.stock[s].product_id === it.productId){ sidx=s; break; } }
    if(sidx >= 0) state.stock[sidx].qty = Number(state.stock[sidx].qty||0) + Number(it.quantity||0);
    else state.stock.push({ stock_id: genId('stock'), product_id: it.productId, qty: Number(it.quantity||0), updated_at: (new Date()).toISOString() });
  }
  persist(); showToast('Invoice deleted'); render();
}

function restoreDeletedSale(delId) {
  if(!confirm('Restore this sale? This will re-add the invoice and reduce stock again.')) return;
  var delArr = JSON.parse(LS.getItem('tara_deleted_sales') || '[]') || [];
  var idx = -1; for(var i=0;i<delArr.length;i++){ if(delArr[i].id === delId){ idx = i; break; } }
  if(idx < 0){ showToast('Not found'); return; }
  var rec = delArr.splice(idx,1)[0];
  // re-add snapshot to invoices (preserve same invoiceNumber, date)
  var snap = rec.snapshot;
  if(snap) {
    // create a new id for active invoice (but preserve invoiceNumber and date)
    var restored = {
      id: genId('inv'),
      invoiceNumber: snap.invoiceNumber || nextInvoiceNumber(),
      date: snap.date || (new Date()).toISOString(),
      customerName: snap.customerName || 'Cash Customer',
      items: JSON.parse(JSON.stringify(snap.items || [])),
      subtotal: snap.subtotal || 0,
      shipping_cost: snap.shipping_cost || 0,
      discount: snap.discount || 0,
      total: snap.total || 0,
      operator: snap.operator || (LS.getItem('device_id') || '')
    };
    state.invoices.push(restored);
    // reduce stock again for each item (mirror initial sale behaviour)
    for(var j=0;j<restored.items.length;j++){
      var it = restored.items[j];
      var sidx=-1; for(var s=0;s<state.stock.length;s++){ if(state.stock[s].product_id === it.productId){ sidx=s; break; } }
      if(sidx>=0){ state.stock[sidx].qty = Math.max(0, Number(state.stock[sidx].qty||0) - Number(it.quantity||0)); state.stock[sidx].updated_at = (new Date()).toISOString(); }
      else {
        // create an entry with zero or negative (floor to 0) to reflect reduction
        state.stock.push({ stock_id: genId('stock'), product_id: it.productId, qty: Math.max(0, -Number(it.quantity||0)), updated_at: (new Date()).toISOString() });
      }
    }
    // persist updated deleted array and state
    LS.setItem('tara_deleted_sales', JSON.stringify(delArr));
    persist();
    showToast('Sale restored: ' + restored.invoiceNumber);
    closeModal('modal-deleted-sales');
    render();
    return;
  } else {
    showToast('Snapshot missing; cannot restore');
    return;
  }
}

function generateReports() {
  var fromStr = document.getElementById('r-from') && document.getElementById('r-from').value ? document.getElementById('r-from').value : null;
  var toStr = document.getElementById('r-to') && document.getElementById('r-to').value ? document.getElementById('r-to').value : null;
  var from = fromStr ? new Date(fromStr + 'T00:00:00') : new Date(0); var to = toStr ? new Date(toStr + 'T23:59:59') : new Date();
  var invoices=[]; for(var i=0;i<state.invoices.length;i++){ var d=new Date(state.invoices[i].date); if(d>=from && d<=to) invoices.push(state.invoices[i]); }
  var purchases=[]; for(var p=0;p<state.purchases.length;p++){ var dd=new Date(state.purchases[p].date); if(dd>=from && dd<=to) purchases.push(state.purchases[p]); }
  var totalRevenue=0; for(var r=0;r<invoices.length;r++) totalRevenue += Number(invoices[r].total||0);
  var totalPurchases=0; for(var q=0;q<purchases.length;q++) totalPurchases += Number(purchases[q].amount_spent||0);
  var gross = totalRevenue - totalPurchases;
  var daily = {}; var productMap = {}; var customerMap = {}; var monthly = {};
  for(var ii=0; ii<invoices.length; ii++){
    var inv = invoices[ii];
    var dKey = (new Date(inv.date)).toISOString().slice(0,10);
    daily[dKey] = (daily[dKey] || 0) + Number(inv.total||0);
    for(var m=0;m<inv.items.length;m++){
      var it = inv.items[m];
      if(!productMap[it.productId]) productMap[it.productId] = { name: it.name, qty:0, sales:0 };
      productMap[it.productId].qty += Number(it.quantity||0);
      productMap[it.productId].sales += Number(it.price * it.quantity || 0);
    }
    var cname = inv.customerName || 'Unknown';
    if(!customerMap[cname]) customerMap[cname] = { name:cname, total:0, invoices:0 };
    customerMap[cname].total += Number(inv.total||0);
    customerMap[cname].invoices += 1;
    var mKey = (new Date(inv.date)).getFullYear() + '-' + String((new Date(inv.date)).getMonth()+1).padStart(2,'0');
    monthly[mKey] = (monthly[mKey] || 0) + Number(inv.total||0);
  }
  // top arrays
  var topProducts=[]; for(var pid in productMap) if(productMap.hasOwnProperty(pid)) topProducts.push(productMap[pid]);
  topProducts.sort(function(a,b){ return b.qty - a.qty; }); topProducts = topProducts.slice(0,10);
  var topCustomers=[]; for(var cn in customerMap) if(customerMap.hasOwnProperty(cn)) topCustomers.push(customerMap[cn]);
  topCustomers.sort(function(a,b){ return b.total - a.total; }); topCustomers = topCustomers.slice(0,10);

  var area = document.getElementById('report-content'); if(!area) return; area.innerHTML='';
  var left = document.createElement('div'); left.className='card'; left.innerHTML = '<div class="font-semibold mb-2">Summary</div><div class="small-muted">Revenue</div><div class="font-bold text-xl">' + formatCurrency(totalRevenue) + '</div><div class="small-muted mt-2">Purchases (Expense)</div><div class="font-semibold">' + formatCurrency(totalPurchases) + '</div><div class="small-muted mt-2">Gross</div><div class="font-bold">' + formatCurrency(gross) + '</div>';
  var prodCard = document.createElement('div'); prodCard.className='card'; var prodHtml = '<div class="font-semibold mb-2">Top Products</div>'; if(topProducts.length){ prodHtml += '<ul class="space-y-1">'; for(var t=0;t<topProducts.length;t++){ prodHtml += '<li class="flex justify-between"><span>' + topProducts[t].name + '</span><span class="font-semibold">' + topProducts[t].qty + '</span></li>'; } prodHtml += '</ul>'; } else prodHtml += '<div class="small-muted">No product data</div>'; prodCard.innerHTML = prodHtml;
  var custCard = document.createElement('div'); custCard.className='card'; var custHtml = '<div class="font-semibold mb-2">Top Customers</div>'; if(topCustomers.length){ custHtml += '<ul class="space-y-1">'; for(var tc=0;tc<topCustomers.length;tc++){ custHtml += '<li class="flex justify-between"><span>' + topCustomers[tc].name + '</span><span class="font-semibold">' + formatCurrency(topCustomers[tc].total) + '</span></li>'; } custHtml += '</ul>'; } else custHtml += '<div class="small-muted">No customer data</div>'; custCard.innerHTML = custHtml;
  var dailyCard = document.createElement('div'); dailyCard.className='card'; var keys = Object.keys(daily); keys.sort(); var dailyHtml = '<div class="font-semibold mb-2">Daily Sales</div>'; if(keys.length){ dailyHtml += '<ul class="space-y-1">'; for(var di=0;di<keys.length;di++){ dailyHtml += '<li class="flex justify-between"><span>' + keys[di] + '</span><span>' + formatCurrency(daily[keys[di]]) + '</span></li>'; } dailyHtml += '</ul>'; } else dailyHtml += '<div class="small-muted">No daily data</div>'; dailyCard.innerHTML = dailyHtml;

  area.appendChild(left); area.appendChild(prodCard); area.appendChild(custCard); area.appendChild(dailyCard);

  state.lastReport = { invoices: invoices, purchases: purchases, totalRevenue: totalRevenue, totalPurchases: totalPurchases, topProducts: topProducts, topCustomers: topCustomers, daily: daily, monthly: monthly, from: fromStr, to: toStr };
}

function toCsv(rows){ if(!rows || !rows.length) return ''; var keys = Object.keys(rows[0]); var out = keys.join(',') + '\n'; for(var r=0;r<rows.length;r++){ var line=[]; for(var k=0;k<keys;k++){ var v = rows[r][keys[k]] || ''; line.push('"' + String(v).replace(/"/g,'""') + '"'); } out += line.join(',') + '\n'; } return out; }

  qrInner += '<label class="inline-flex items-center mt-2"><input type="checkbox" id="set-show-insta" class="mr-2" ' + (state.settings.show_insta_qr ? 'checked' : '') + ' />Show Instagram QR on Invoice</label>';

function handleQrFile(ev, which) {

function fileToDataUrl(file, cb) {
  var reader = new FileReader();
  reader.onload = function(){ cb(reader.result); };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}
